<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retinal Disease Detector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-ENjdO4Dr2bkBIFxQpeo5z1X5bQ7c1Zc5Q5+Z4t6f5K2V5KZ1c7xV9K3tK1Zp9K6V"
          crossorigin="anonymous">
    <style>
        body { background-color:#f8f9fa; }
        .result-box { min-height:80px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:600; border-radius:8px; }
        .btn-analyze { font-size:1.1rem; padding:0.75rem 1.5rem; }
        #preview { max-width:100%; height:auto; border:1px solid #dee2e6; border-radius:4px; margin-top:1rem; }
    </style>
</head>
<body>
<div class="container py-5">
    <h1 class="mb-4 text-center">👁️ Retinal Disease Detector</h1>
    <p class="text-center text-muted mb-4">
        Upload a fundus photo (JPG/PNG) to get a fast screening result.<br>
        <small>Model: MobileNetV2 – 8 classes. Not a substitute for a professional exam.</small>
    </p>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Choose fundus image</label>
                    <input class="form-control" type="file" id="fileInput" accept=".jpg,.jpeg,.png" required>
                </div>
                <div id="previewWrapper" class="text-center mb-3 d-none">
                    <img id="preview" alt="Preview">
                </div>
                <button type="submit" class="btn btn-primary btn-analyze w-100" id="analyzeBtn">
                    Analyze Image
                </button>
            </form>
        </div>
    </div>

    <div class="row justify-content-center mt-4">
        <div class="col-md-8">
            <div id="resultBox" class="result-box d-none"></div>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('fileInput');
    const previewWrapper = document.getElementById('previewWrapper');
    const previewImg = document.getElementById('preview');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resultBox = document.getElementById('resultBox');

    // Show thumbnail when a file is selected
    fileInput.addEventListener('change', function () {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                previewImg.src = e.target.result;
                previewWrapper.classList.remove('d-none');
            };
            reader.readAsDataURL(file);
        } else {
            previewWrapper.classList.add('d-none');
        }
    });

    // Prevent form submission, handle via fetch
    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        if (!fileInput.files.length) return;

        const file = fileInput.files[0];
        const formData = new FormData();
        formData.append('file', file);

        // UI feedback
        analyzeBtn.disabled = true;
        analyzeBtn.textContent = 'Analyzing…';
        resultBox.classList.add('d-none');
        resultBox.textContent = '';

        try {
            const response = await fetch('/detect/', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                throw new Error(`Server responded ${response.status}`);
            }
            const data = await response.json();

            // Build result box
            const disease = data.disease || 'unknown';
            const confidence = Number(data.confidence) || 0;
            const status = data.status || 'error';

            let bgColor, textColor;
            if (status === 'success') {
                if (confidence >= 0.7) { bgColor = '#d4edda'; textColor = '#155724'; }
                else if (confidence >= 0.5) { bgColor = '#fff3cd'; textColor = '#856404'; }
                else { bgColor = '#f8d7da'; textColor = '#721c24'; }
            } else {
                bgColor = '#f8d7da';
                textColor = '#721c24';
            }

            resultBox.style.backgroundColor = bgColor;
            resultBox.style.color = textColor;
            const displayDisease = disease.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            resultBox.innerHTML = `<strong>${displayDisease}</strong><br>${(confidence*100).toFixed(0)}%`;
            resultBox.classList.remove('d-none');

            // Show Grad-CAM if available
            if (data.gradcam_url) {
                previewImg.src = data.gradcam_url;
                const note = document.createElement('p');
                note.className = 'text-center text-muted small mt-2';
                note.id = 'gradcamNote';
                note.innerText = 'Heatmap shows areas influencing the AI decision';
                if (!document.getElementById('gradcamNote')) {
                    previewWrapper.appendChild(note);
                }
            }

        } catch (err) {
            console.error(err);
            resultBox.style.backgroundColor = '#f8d7da';
            resultBox.style.color = '#721c24';
            resultBox.innerHTML = `<strong>Error</strong><br>${err.message}`;
            resultBox.classList.remove('d-none');
        } finally {
            // Re‑enable button
            analyzeBtn.disabled = false;
            analyzeBtn.textContent = 'Analyze Image';
        }
    });
</script>

<!-- Bootstrap JS (optional for dropdowns, not needed here) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+6I1c3eX+5V5U+fQ7Q+6+5oTQ"
        crossorigin="anonymous"></script>
</body>
</html>
